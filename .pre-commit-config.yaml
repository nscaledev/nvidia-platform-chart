---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
  - repo: https://github.com/norwoodj/helm-docs.git
    rev: v1.14.2
    hooks:
      - id: helm-docs
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'out=$(gofmt -l "$@") || exit 1; [ -z "$out" ] || { echo "$out"; exit 1; }' --
        language: system
        files: \.go$
      - id: helm-lint
        name: Helm Lint
        entry: bash -c 'helm dependency build chart && helm lint chart && helm template chart --set ncclFabricNri.enabled=true > /dev/null && helm template chart -f chart/values-dra.yaml --api-versions resource.k8s.io/v1/DeviceClass > /dev/null && helm template chart --set nvsentinel.enabled=true --set gpu-operator.dcgm.enabled=true > /dev/null && helm template chart -f chart/values-dra.yaml --set nvsentinel.enabled=true --api-versions resource.k8s.io/v1/DeviceClass > /dev/null'
        language: system
        files: ^chart/
        pass_filenames: false
