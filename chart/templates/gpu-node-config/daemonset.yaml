{{- if .Values.gpuNodeConfig.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-node-config
  labels:
    {{- include "nvidia-platform.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: gpu-node-config
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.gpuNodeConfig.maxUnavailable }}
  template:
    metadata:
      labels:
        app: gpu-node-config
    spec:
      nodeSelector:
        {{- toYaml .Values.gpuNodeConfig.nodeSelector | nindent 8 }}
      hostPID: true
      containers:
        - name: gpu-node-config
          image: {{ .Values.gpuNodeConfig.image }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              # Feed the scripts to the host's bash on stdin rather than copying
              # them to the host and exec'ing them there - hardened node images
              # mount /tmp noexec. chroot is needed for the host's pciutils.
              chroot /host /bin/bash -s < /scripts/iommu_passthrough.sh
              chroot /host /bin/bash -s < /scripts/acs_disable.sh
              echo "gpu-node-config complete, sleeping."
              exec sleep infinity
          securityContext:
            privileged: true
          volumeMounts:
            - name: host
              mountPath: /host
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: host
          hostPath:
            path: /
        - name: scripts
          configMap:
            name: gpu-node-config-scripts
      tolerations:
        {{- toYaml .Values.gpuNodeConfig.tolerations | nindent 8 }}
{{- end }}
