{{- if .Values.ncclInfiniBand.enabled }}
{{- $name := printf "%s-nccl-infiniband" (include "nvidia-platform.name" .) }}
{{- $label := .Values.ncclInfiniBand.optInLabel }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "nvidia-platform.labels" . | nindent 4 }}
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  # A broken expression must not block pod creation cluster-wide; the pod is then admitted
  # without the variables, as it would be without this policy.
  failurePolicy: Ignore
  reinvocationPolicy: IfNeeded
  variables:
    - name: env
      expression: >-
        [{{- range $i, $k := keys .Values.ncclInfiniBand.env | sortAlpha }}{{ if $i }}, {{ end }}{'name': {{ $k | quote }}, 'value': {{ index $.Values.ncclInfiniBand.env $k | toString | quote }}}{{- end }}]
  mutations:
    # Each container gets only the variables it does not already set, so a job's own value
    # wins. Containers are merged by name and env entries by name.
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              containers: object.spec.containers.map(c, Object.spec.containers{
                name: c.name,
                env: variables.env
                  .filter(e, !has(c.env) || !c.env.exists(x, x.name == e.name))
                  .map(e, Object.spec.containers.env{name: e.name, value: e.value})
              })
            }
          }
---
# Opt in by namespace label.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}-namespaces
  labels:
    {{- include "nvidia-platform.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  matchResources:
    namespaceSelector:
      matchLabels:
        {{ $label }}: "true"
---
# Opt in by pod label, in any namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}-pods
  labels:
    {{- include "nvidia-platform.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  matchResources:
    objectSelector:
      matchLabels:
        {{ $label }}: "true"
{{- end }}
