# Example overlay for enabling the full Dynamic Resource Allocation (DRA) stack:
# the GPUCluster CR (DRA driver for GPUs) instead of the classic ClusterPolicy
# stack, and DRANET (DRA driver for RDMA-capable NICs) instead of the RDMA
# shared device plugin. Together these let workloads request a GPU and a NIC
# aligned to the same PCIe root or NUMA node (see Data Direct hardware below)
# via a constraint on a ResourceClaimTemplate.
#
# This file is not referenced anywhere automatically - pass it explicitly alongside
# the chart's default values, e.g.:
#
#   helm install nvidia-platform ./chart --namespace nvidia-platform --create-namespace \
#     -f chart/values-dra.yaml
#
# Requires Kubernetes 1.35+ (DRANET's own documented minimum; higher than the GPU
# DRA driver's 1.34.2+) and an NRI-enabled container runtime (containerd 1.7+ or
# CRI-O with NRI enabled) on every node -- neither this chart nor Network Operator
# configures the runtime for NRI.
#
# On ConnectX-8 "Data Direct" hardware (GB200/GB300, and upcoming VR-generation
# platforms), matchAttribute: resource.kubernetes.io/pcieRoot does not reliably
# align GPUs and NICs. Data Direct means the GPU and NIC are not colocated under
# one PCI switch the way plain ConnectX-7 setups are, and there is currently no
# standard attribute that expresses the resulting topology; see
# https://github.com/kubernetes-sigs/dra-driver-nvidia-gpu/issues/1123 (open as
# of this writing, proposing a new attribute for it).
#
# Constrain on resource.kubernetes.io/numaNode on that hardware instead: both
# the GPU DRA driver (draDriver: v0.5.1) and DRANET (dranet chart v1.5.0) pinned
# here publish it as a scalar, so a matchAttribute constraint on it aligns a GPU
# claim and a NIC claim to the same NUMA node. This is coarser than PCIe-root
# alignment: any NIC on the GPU's NUMA node matches, not only the topologically
# closest one. pcieRoot remains the right constraint on hardware without Data
# Direct (e.g. plain ConnectX-7 nodes).
#
# Whole-node claims need no constraint: a ResourceClaimTemplate that consumes
# every GPU and every NIC on a node has no other claimant to mismatch against.
# Partial-node claims behave differently from today's stack:
# rdmaSharedDevicePlugin's Allocate() exposes every HCA in the resource pool to
# every consuming container regardless of how many were requested (the
# application itself picks the topologically appropriate NIC per GPU at
# runtime), whereas a DRA claim for M NICs exposes only those M specific devices
# the scheduler picked -- aligned only as tightly as the constraint allows. To
# reproduce today's in-pod visibility for a partial-GPU pod, claim every NIC on
# the node alongside it -- this works, but excludes every other pod on that node
# from NICs entirely, which is the same one-consumer-per-device capacity
# tradeoff of adopting DRA at all: today's rdmaSharedDevicePlugin lets up to
# rdmaHcaMax (8 by default) pods share one HCA, while DRA allocates each device
# to exactly one consumer.
#
# Upgrading from dranet chart v1.4.0 to v1.5.0 adds a host mount for
# /var/run/dranet, where DRANET persists pod device configuration. Stop pods
# that use DRANET-managed devices before upgrading, or their state is orphaned
# inside the old container filesystem.
#
# Switching stacks on an existing installation deletes the unprotected
# ClusterPolicy/GPUCluster CR (gpu-operator.operator.cleanupCRD defaults to false)
# and cascades into the driver/toolkit/device-plugin stack being torn down and
# replaced on every GPU node; it also changes how workloads request RDMA NICs
# (extended resource "nscale.com/rdmashare" -> ResourceClaim against the
# "rdma.nscale.com" DeviceClass this chart creates). NVIDIA recommends performing
# this switch on a fresh cluster rather than upgrading in place.
#
# DRANET only exposes RDMA devices that the host kernel already has configured; it
# does not install the RDMA driver itself, so nicClusterPolicy.ofedDriver stays
# enabled. DRANET moves a claimed interface, including any IP already configured
# on it, into the requesting pod's network namespace; it automatically excludes
# the interface holding the node's default route, but not other host-reserved
# RDMA interfaces (e.g. one also carrying storage traffic) -- exclude those
# explicitly via --set dranet.args.filter='<CEL expression>' if applicable.
#
# Workloads request the alignment themselves via a ResourceClaimTemplate; see
# https://dranet.sigs.k8s.io/docs/user/nvidia-dranet/ for the general pattern
# (written against pcieRoot -- on Data Direct hardware, substitute numaNode as
# described above).

gpu-operator:
  driver:
    nvidiaDriverCRD:
      # Enable driver installation via the NVIDIADriver CRD (required when gpuCluster.deployCR is true)
      enabled: true
  # Deploy the ClusterPolicy CR (mutually exclusive with gpuCluster.deployCR)
  clusterPolicy:
    deployCR: false
  # Deploy the GPUCluster CR to enable the DRA driver for GPU and ComputeDomain resource allocation
  gpuCluster:
    deployCR: true
  # Run the standalone DCGM hostengine rather than dcgm-exporter's embedded one: GPUCluster's
  # DRA driver dynamically creates/destroys ComputeDomain partitions, and only the standalone
  # hostengine picks up those changes without a dcgm-exporter restart.
  dcgm:
    enabled: true

nicClusterPolicy:
  # Mutually exclusive with dranetDeviceClass.enabled: both would manage the same physical RDMA devices
  rdmaSharedDevicePlugin:
    enabled: false

dranetDeviceClass:
  enabled: true
