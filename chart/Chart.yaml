apiVersion: v2
name: nvidia-platform
description: Umbrella chart for deploying NVIDIA GPU/network infrastructure and
  node-level tuning
type: application
version: 0.5.0
appVersion: "1.0.0"

dependencies:
  - name: node-feature-discovery
    version: 0.20.1
    repository: oci://registry.k8s.io/nfd/charts
    condition: node-feature-discovery.enabled

  # On upgrade, keep files/dcgm-metrics.csv a superset of the bundled dcgm-exporter's etc/dcp-metrics-included.csv.
  - name: gpu-operator
    version: v26.7.2
    repository: https://helm.ngc.nvidia.com/nvidia
    condition: gpu-operator.enabled

  - name: network-operator
    version: 26.7.1
    repository: https://helm.ngc.nvidia.com/nvidia
    condition: network-operator.enabled

  - name: dranet
    version: v1.5.0
    repository: oci://registry.k8s.io/networking/charts
    condition: dranetDeviceClass.enabled

  - name: nvsentinel
    version: v1.30.0
    repository: oci://ghcr.io/nvidia
    condition: nvsentinel.enabled
